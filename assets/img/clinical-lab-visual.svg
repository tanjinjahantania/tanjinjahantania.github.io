  <g transform="translate(168 190)">
    <path d="M0 0 H360" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M0 68 H300" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M0 136 H400" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M0 204 H250" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M18 135 L78 135 L110 92 L158 198 L208 50 L256 135 L342 135" fill="none" stroke="#f4b24c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
