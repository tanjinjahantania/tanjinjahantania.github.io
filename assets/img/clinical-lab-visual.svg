        <rect x="88" y="0" width="42" height="245" rx="20" fill="url(#tube)" stroke="#0f3a35" stroke-width="8"/>
        <rect x="164" y="0" width="42" height="245" rx="20" fill="url(#tube)" stroke="#0f3a35" stroke-width="8"/>
        <path d="M18 174 H48" stroke="#d85f45" stroke-width="20" stroke-linecap="round"/>
        <path d="M94 150 H124" stroke="#7251b5" stroke-width="20" stroke-linecap="round"/>
