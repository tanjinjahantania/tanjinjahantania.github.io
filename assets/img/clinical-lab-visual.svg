<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Veterinary clinical and laboratory visual</title>
  <desc id="desc">A clean illustrated veterinary laboratory and clinical practice scene with diagnostic tools, sample tubes, a microscope, a stethoscope, and public health motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f1a"/>
      <stop offset="0.42" stop-color="#0f3a35"/>
      <stop offset="1" stop-color="#f4b24c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ee" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#dfeee9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#68b6ad" stop-opacity="0.86"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#06110f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M0 770 C220 670 310 750 520 650 C770 532 930 594 1110 468 C1288 342 1408 370 1600 230 L1600 1000 L0 1000 Z" fill="#07231f" fill-opacity="0.48"/>
  <path d="M1070 120 C1260 78 1460 148 1560 310 C1465 276 1350 286 1240 352 C1125 420 1032 515 908 510 C1010 410 1040 258 1070 120 Z" fill="#f7f4ee" fill-opacity="0.13"/>

  <g transform="translate(720 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="650" rx="18" fill="url(#panel)"/>
    <rect x="44" y="50" width="632" height="66" rx="8" fill="#0f3a35"/>
    <circle cx="88" cy="83" r="14" fill="#d85f45"/>
    <circle cx="130" cy="83" r="14" fill="#f4b24c"/>
    <circle cx="172" cy="83" r="14" fill="#68b6ad"/>
